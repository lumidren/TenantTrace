# Degraded copies of attack scenarios. Each variant starts from a base scenario, applies one
# degradation to its exports and states the gap the tool must report.
variants:
  - id: degraded_no_signins
    base: attack_legacy_forwarding
    title: "Legacy/forwarding attack with the sign-in logs not supplied"
    degrade: {remove_formats: [entra_signin_csv]}
    truth:
      expected_gaps:
        - {source: entra_signin_interactive, kind: missing}
        - {source: entra_signin_noninteractive, kind: missing}
      # the spray is still visible through the audit log's copies of the failed and successful logons,
      # which also lets mail access be linked to the spraying address
      expected_not_assessable: [TT-SIGNIN-001, TT-SIGNIN-002, TT-SIGNIN-003, TT-SIGNIN-004, TT-SIGNIN-005,
                                TT-SIGNIN-007]
      drop_expected_rules: [TT-SIGNIN-001, TT-SIGNIN-002, TT-SIGNIN-003, TT-SIGNIN-004, TT-SIGNIN-005,
                            TT-SIGNIN-007]
  - id: degraded_ual_truncated
    base: attack_legacy_forwarding
    title: "Legacy/forwarding attack with the audit log export cut off before the attack ended"
    degrade: {truncate_format: ps_ual_csv, keep_until: "2026-09-29T04:25:00Z"}
    truth:
      expected_gaps:
        - {source: ual, kind: truncated}
        - {source: ual, kind: ends_early}
      drop_expected_truth_ids: [imap_sync]
  - id: degraded_retention_7d
    base: attack_travel_delegate
    title: "Impossible-travel attack with sign-in logs limited to the last 7 days"
    degrade: {retention_days: {entra_signin_json: 7}}
    truth:
      expected_gaps:
        - {source: entra_signin_interactive, kind: retention, cause_contains: "7"}
        - {source: entra_signin_noninteractive, kind: retention, cause_contains: "7"}
      # the attack sign-ins (9 days before collection) fall outside a 7-day retention window
      expected_not_assessable: [TT-SIGNIN-001, TT-SIGNIN-003]
      drop_expected_rules: [TT-SIGNIN-001, TT-SIGNIN-002, TT-SIGNIN-003, TT-SIGNIN-007]
  - id: degraded_no_mailbox_audit
    base: demo_bec
    title: "Demo attack with mailbox auditing absent (no mailbox item records)"
    degrade: {drop_operations: [MailItemsAccessed, Send, SoftDelete, HardDelete, MoveToDeletedItems]}
    truth:
      expected_gaps:
        - {source: entra_signin_noninteractive, kind: missing}
        - {source: ual_mailbox_items, kind: auditing_absent}
      expected_not_assessable: [TT-MAIL-004]
      drop_expected_rules: [TT-MAIL-004]
  - id: degraded_quiet_period
    base: attack_travel_delegate
    title: "Impossible-travel attack with two working days missing from the audit log export"
    degrade: {drop_window: {formats: [purview_ual_csv], from: "2026-10-20T00:00:00Z", to: "2026-10-22T00:00:00Z"}}
    truth:
      expected_gaps:
        - {source: ual, kind: quiet}
  - id: collector_hawk_legacy
    base: attack_legacy_forwarding
    title: "Legacy/forwarding attack collected with Hawk for the one compromised user"
    exports_override:
      - {format: hawk, path: "Hawk"}
    truth:
      # Hawk collects per-user audit records only: no Entra sign-in logs, no SharePoint, no other accounts
      expected_gaps:
        - {source: entra_signin_interactive, kind: missing}
        - {source: entra_signin_noninteractive, kind: missing}
        - {source: ual_sharepoint, kind: auditing_absent}
        - {source: ual, kind: filtered}
      expected_not_assessable: [TT-SIGNIN-001, TT-SIGNIN-002, TT-SIGNIN-003, TT-SIGNIN-004, TT-SIGNIN-005,
                                TT-SIGNIN-007]
      drop_expected_rules: [TT-SIGNIN-001, TT-SIGNIN-002, TT-SIGNIN-003, TT-SIGNIN-004, TT-SIGNIN-005,
                            TT-SIGNIN-007]
      pivot_users: []
