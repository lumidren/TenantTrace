id: benign_admin_bulk
title: "Benign: an IT administrator migrating files in bulk and granting shared mailbox access"
kind: benign
seed: 8080
tenant: {name: Kestrel Freight, domain: kestrel.example}
period: {start: "2026-10-13T18:00:00Z", end: "2026-11-12T18:00:00Z"}
