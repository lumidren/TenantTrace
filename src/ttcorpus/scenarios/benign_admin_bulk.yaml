  - {key: carl, alias: carl.jensen, display: Carl Jensen, role: admin, home: leeds, file_activity: 3.0}
  - {key: fiona, alias: fiona.drake, display: Fiona Drake, role: finance, home: london}
infra: {}
scripts:
