         client_app: "Other clients", expect: [TT-SIGNIN-006]}
      - {id: imap_success, at: "+125m", do: signin, user: lena, from: atk_spray, ua: imap, client_app: IMAP4,
         app: owa, resource: exchange, interactive: false, auth_requirement: singleFactorAuthentication,
         mfa_detail: "", session: atk1, expect: [TT-SIGNIN-004, TT-SIGNIN-001]}
      - {id: owa_single_factor, at: "+140m", do: signin, user: lena, from: atk_spray, ua: attacker_linux,
         client_app: Browser, app: office, auth_requirement: singleFactorAuthentication, mfa_detail: "",
         session: atk2, expect: [TT-SIGNIN-005, TT-SIGNIN-003]}
      - {id: forwarding, at: "+151m", do: exchange_cmdlet, user: lena, session: atk2, cmdlet: Set-Mailbox,
         params: {ForwardingSmtpAddress: "smtp:lena.brook.records@mailbox-relay.example.net",
                  DeliverToMailboxAndForward: "True"}, expect: [TT-MAIL-002]}
      - {id: imap_sync, at: "+170m", do: mail_access, user: lena, session: atk1, access: Sync, events: 4, items: 120,
         client_info: "Client=IMAP4", expect: [TT-MAIL-004]}
exports:
