[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenanttrace"
version = "0.1.0"
description = "Offline investigation and reporting for Microsoft 365 business email compromise and account takeover cases"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "PyYAML>=6.0",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
tenanttrace = "tenanttrace.cli:main"
ttcorpus = "ttcorpus.cli:main"
tteval = "tteval.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenanttrace = ["rules/*.yaml", "reference/*.yaml", "report/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (performance, large inputs)",
]
